# Tags every new version on main, publishes a GitHub Release from the
# changelog, and comments "Shipped in vX.Y.Z" on each Linear issue (URG-123)
# named in the pushed commits. Runs on GitHub Actions only: it never commits
# back to the repo, so it never triggers a Vercel deploy.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      COMMITS: ${{ toJson(github.event.commits) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from the changelog
        if: steps.v.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node - <<'JS' > notes.md
          const fs = require('fs');
          const src = fs.readFileSync('packages/changelog/src/index.ts', 'utf8');
          const v = process.env.VERSION;
          const at = src.indexOf(`version: "${v}"`);
          let out = '';
          if (at !== -1) {
            const rest = src.slice(at);
            const end = rest.indexOf('\n  },');
            const block = end === -1 ? rest : rest.slice(0, end);
            const hl = block.match(/highlights:\s*\[([\s\S]*?)\]/);
            if (hl) {
              for (const m of hl[1].matchAll(/"((?:[^"\\]|\\.)*)"/g)) out += `- ${JSON.parse('"' + m[1] + '"')}\n`;
            }
          }
          if (!out) out = 'Internal changes.\n';
          process.stdout.write(out);
          JS
          echo "" >> notes.md
          echo "**Commits**" >> notes.md
          echo "$COMMITS" | jq -r '.[] | "- \(.message | split("\n")[0]) (\(.id[0:7]))"' >> notes.md

      - name: Tag and publish the GitHub Release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --latest

      - name: Comment the version on Linear issues
        if: steps.v.outputs.exists == 'false' && env.LINEAR_API_KEY != ''
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          IDS=$(echo "$COMMITS" | jq -r '.[].message' | grep -oE '\bURG-[0-9]+\b' | sort -u || true)
          [ -z "$IDS" ] && { echo "No Linear issues named."; exit 0; }
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          for ID in $IDS; do
            BODY="Shipped in [v${VERSION}](${URL})."
            jq -n --arg id "$ID" --arg body "$BODY" \
              '{query:"mutation($id:String!,$body:String!){commentCreate(input:{issueId:$id,body:$body}){success}}",variables:{id:$id,body:$body}}' \
            | curl -sS https://api.linear.app/graphql \
                -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" -d @- \
            | jq -c --arg id "$ID" '{issue:$id, ok:(.data.commentCreate.success // false), errors:.errors}'
          done
